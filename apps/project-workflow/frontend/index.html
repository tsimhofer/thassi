<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thassi — Home Assistant Modul-Workflow &amp; Projektverwaltung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-deep: #040711;
        --bg-card: rgba(15, 23, 42, 0.78);
        --bg-node: rgba(15, 23, 42, 0.92);
        --border-subtle: rgba(148, 163, 184, 0.16);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --sig-green: #22c55e;
        --sig-cyan: #38bdf8;
        --sig-amber: #f59e0b;
        --sig-red: #ef4444;
        --sig-slate: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #0c192c 0%, #040711 65%);
        color: var(--text-main);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes n8nFlowDash {
        to {
          stroke-dashoffset: -28;
        }
      }
      @keyframes n8nPulseGlow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45), 0 0 22px rgba(56, 189, 248, 0.28);
          transform: translateY(0px);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.08), 0 0 32px rgba(56, 189, 248, 0.55);
          transform: translateY(-2px);
        }
      }
      @keyframes statusDotBlink {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(1.25);
        }
      }
      .n8n-edge-animated {
        stroke-dasharray: 8 6;
        animation: n8nFlowDash 0.85s linear infinite;
      }
      .n8n-node-card {
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .n8n-node-card:hover {
        transform: translateY(-3px);
      }
      .n8n-node-running {
        animation: n8nPulseGlow 1.3s ease-in-out infinite;
      }
      .signal-dot-active {
        animation: statusDotBlink 1.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
