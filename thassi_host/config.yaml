name: "Thassi Personal App Hub"
version: "1.0.1"
slug: "thassi_host"
description: "Full-Stack TypeScript App Host, SQLite Data Hub, Google OAuth Vault, and Hot-Deploy Runtime for Home Assistant"
url: "https://github.com/tsimhofer/thassi"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:apps-box"
panel_title: "Thassi Hub"
panel_admin: false
homeassistant_api: true
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Direct LAN & CLI Hot-Deploy Port (thassi deploy)"
options:
  deploy_secret: ""
schema:
  deploy_secret: "password?"
