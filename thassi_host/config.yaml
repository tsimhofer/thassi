name: "Thassi Horizon"
version: "1.0.9"
slug: "thassi_host"
description: "Fullscreen Calendar-Centric Main Dashboard & Unified Hub for Home Assistant"
url: "https://github.com/tsimhofer/thassi"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:weather-sunset"
panel_title: "Horizon"
panel_admin: false
homeassistant_api: true
hassio_api: true
map:
  - homeassistant_config:rw
watchdog: "http://[HOST]:[PORT:8099]/healthz"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Direct LAN & CLI Hot-Deploy Port (thassi deploy)"
options:
  deploy_secret: ""
schema:
  deploy_secret: "password?"
