name: "Thassi Unified Dashboard"
version: "1.0.2"
slug: "thassi_host"
description: "Unified Smart Home, Google Health, Meal Planner, Google Calendar & Finance Command Center for Home Assistant"
url: "https://github.com/tsimhofer/thassi"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:view-dashboard-variant"
panel_title: "Thassi Dashboard"
panel_admin: false
homeassistant_api: true
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Direct LAN & CLI Hot-Deploy Port (thassi deploy)"
options:
  deploy_secret: ""
schema:
  deploy_secret: "password?"
